name: build-dist
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unzip project
        run: unzip -q ugd-pwa-final.zip -d site
      - name: Build
        run: |
          cd site
          npm install --no-audit --no-fund
          npx vite build
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
